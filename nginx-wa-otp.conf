# Konfigurasi Nginx untuk WhatsApp OTP Gateway
# Simpan di /etc/nginx/sites-available/wa-otp.conf

server {
    listen 80;
    server_name otp.domainanda.com; # Ganti dengan domain/subdomain VPS Anda

    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/wa_otp_access.log;
    error_log /var/log/nginx/wa_otp_error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Header Standar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Konfigurasi Wajib untuk WebSocket (Baileys) & SSE (Live Stream Logs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
